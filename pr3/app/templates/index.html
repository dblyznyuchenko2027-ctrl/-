<meta charset="utf-8">
<title>Помічник служби підтримки — ПР3</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 44rem; margin: 3rem auto; padding: 0 1.25rem;
         font: 16px/1.55 system-ui, sans-serif; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  p.lead { margin-top: 0; opacity: .75; }
  textarea { width: 100%; min-height: 7rem; padding: .6rem .7rem; font: inherit;
             border: 1px solid #8886; border-radius: .4rem; resize: vertical; }
  button { margin-top: .75rem; padding: .5rem 1.1rem; font: inherit;
           border: 0; border-radius: .4rem; background: #2563eb; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
  #answer { margin-top: 1.5rem; padding: 1rem; border: 1px solid #8886;
            border-radius: .4rem; white-space: pre-wrap; }
  #answer:empty { display: none; }
  .meta { margin-top: .6rem; font-size: .85rem; opacity: .7; }
  .error { border-color: #dc2626; }
</style>

<h1>Помічник служби підтримки</h1>
<p class="lead">Відповідає на підставі правил магазину з файлу <code>context.md</code>.</p>

<form id="form">
  <textarea id="question" placeholder="Замовив навушники три дні тому, хочу повернути. Чи можна?" required></textarea>
  <button type="submit">Запитати</button>
</form>

<div id="answer"></div>
<div class="meta" id="meta"></div>

<script>
  const form = document.getElementById('form');
  const question = document.getElementById('question');
  const answer = document.getElementById('answer');
  const meta = document.getElementById('meta');
  const button = form.querySelector('button');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    answer.className = '';
    answer.textContent = 'Запит виконується…';
    meta.textContent = '';

    try {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question.value }),
      });
      const data = await response.json();

      if (!response.ok) {
        answer.className = 'error';
        answer.textContent = data.detail || `Помилка ${response.status}`;
        return;
      }

      // Склад полів відповіді визначаєте ви — тут показано найочікуваніші.
      answer.textContent = data.answer ?? JSON.stringify(data, null, 2);
      const parts = [];
      if (data.model) parts.push(`модель: ${data.model}`);
      if (data.elapsed !== undefined) parts.push(`час: ${Number(data.elapsed).toFixed(2)} с`);
      meta.textContent = parts.join(' · ');
    } catch (error) {
      answer.className = 'error';
      answer.textContent = 'Не вдалося звʼязатися із застосунком.';
    } finally {
      button.disabled = false;
    }
  });
</script>
